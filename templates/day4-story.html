<style>

  .headline {

    letter-spacing: -2.5px;
    color: var(--ink);

  .sub {
    position: absolute; top: 855px; left: 130px; right: 130px;
    font-size: 33px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-secondary);
  }

    position: absolute; top: 1058px; left: 50%; transform: translateX(-50%);

    padding: 28px 52px; font-size: 31px;
