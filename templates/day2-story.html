<meta charset="utf-8">
<title>Day 2 — Challenges (story 1080×1920)</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .canvas {

  .glow.g1 { width: 720px; height: 720px; right: -240px; top: -260px; background: rgba(255, 107, 0, 0.16); }

  .lockup img { width: 128px; height: 128px; }
  .lockup .word { font-size: 56px; color: var(--ink); }

  .kicker {
    position: absolute; top: 425px; left: 50%; transform: translateX(-50%);
    background: var(--primary);
    color: var(--white);

    letter-spacing: 4px;
    box-shadow: 0 14px 34px rgba(255, 107, 0, 0.32);
  }
  .headline {
    position: absolute; top: 525px; left: 80px; right: 80px;
    font-size: 104px;
    font-weight: 900;
    line-height: 1.06;
    letter-spacing: -3px;
  }
  .headline em { font-style: normal; color: var(--primary); }
  .sub {
    position: absolute; top: 830px; left: 130px; right: 130px;
    font-size: 33px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-secondary);
  }
  .cta {
    position: absolute; top: 1055px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: var(--white);
    padding: 28px 52px; font-size: 31px;
    box-shadow: 0 16px 40px rgba(255, 107, 0, 0.38);
  }

  .phone { position: absolute; left: 50%; top: 1230px; width: 560px; transform: translateX(-50%) rotate(-4deg); }
  .phone .screen { height: 900px; }

  <div class="phone">
