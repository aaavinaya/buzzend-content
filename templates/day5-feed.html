<title>Day 5 — Streaks (feed 1080×1080)</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>

  .copy { position: absolute; left: 72px; top: 268px; width: 560px; }
  .kicker {

    color: var(--ink);
    padding: 16px 28px;

  .headline {
    margin-top: 44px;
    font-size: 92px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -2.5px;

    margin-top: 36px;

    font-weight: 500;
