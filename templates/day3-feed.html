<!-- @dsCard group="Week 1 · Feed posts" -->
<!--
  DAY 3 · AI workouts — feed post 1080×1080 (Instagram + Facebook)
  Reuse: swap .kicker / .headline / .sub / .cta text and the screenshot.
-->
<meta charset="utf-8">
<title>Day 3 — AI workouts (feed 1080×1080)</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .canvas {
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #111111 0%, #1c0a00 58%, #2b1200 100%);
    color: var(--white);
  }
  .glow.g1 { width: 620px; height: 620px; right: -160px; top: -180px; background: rgba(255, 107, 0, 0.38); }
  .glow.g2 { width: 560px; height: 560px; left: -200px; bottom: -220px; background: rgba(226, 90, 0, 0.30); }

  .lockup { position: absolute; top: 64px; left: 72px; }
  .lockup img { width: 84px; height: 84px; }
  .lockup .word { font-size: 46px; color: var(--white); }

  .copy { position: absolute; left: 72px; top: 260px; width: 560px; }
  .kicker {
    background: var(--primary);
    color: var(--white);
    padding: 16px 28px;
    font-size: 25px;
    letter-spacing: 3px;
    box-shadow: 0 12px 32px rgba(255, 107, 0, 0.35);
  }
  .headline {
    margin-top: 44px;
    font-size: 98px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -2.5px;
  }
  .headline em { font-style: normal; color: var(--accent); }
  .sub {
    margin-top: 36px;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.88);
  }
  .cta { position: absolute; left: 72px; bottom: 96px; }
  .cta .primary { background: var(--white); color: var(--primary); padding: 26px 44px; font-size: 29px; box-shadow: 0 16px 40px rgba(255, 107, 0, 0.28); }

  /* Screen crop: 720px of a 946px-tall shot keeps the SQUATS pills, the big
     live counter and the full pose skeleton visible; the Pause/Finish row and
     status pill at the bottom of the screenshot stay cropped. */
  .phone { position: absolute; right: -50px; top: 350px; width: 460px; transform: rotate(4deg); }
  .phone .screen { height: 720px; }

  .chip { left: 585px; top: 282px; padding: 22px 30px; font-size: 25px; transform: rotate(3deg); }
  .chip .em { font-size: 32px; }
</style>

<div class="canvas">
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="lockup">
    <img src="../assets/app-icon.png" alt="">
    <div class="word">Buzzend</div>
  </div>

  <div class="copy">
    <span class="pill kicker">DAY 3 · AI WORKOUTS</span>
    <div class="headline">It counts<br>your <em>reps.</em></div>
    <div class="sub">Point the camera at yourself and go. AI pose detection tracks every squat, push-up and jumping jack — <span style="white-space: nowrap;">hands-free.</span></div>
  </div>

  <div class="cta">
    <span class="pill primary">Try an AI workout</span>
  </div>

  <div class="phone">
    <div class="screen"><img src="../assets/screens-clean/ai-counter.png" alt="Buzzend AI rep counter screen"></div>
  </div>

  <div class="chip"><span class="em">⚡</span> 9 / 15 reps · counted live</div>
</div>
