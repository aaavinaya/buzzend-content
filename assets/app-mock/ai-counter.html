<!--
  Mock of the Buzzend AI workout capture screen (360×800 design size).
  Recreated from the shipped app's capture UI so marketing shots need
  no real camera footage or personal data. Render at 3× → app screen PNG.
-->
<meta charset="utf-8">
<title>AI counter — capture mock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 360px; height: 800px; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 30%, #3a2a20 0%, #241a12 45%, #12100e 100%);
    position: relative;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  @font-face {
    font-family: "Inter";
    src: url("../fonts/Inter-latin.woff2") format("woff2");
    font-weight: 100 900;
  }

  /* soft floor glow behind the subject */
  .floor {
    position: absolute; left: 50%; top: 585px; transform: translateX(-50%);
    width: 300px; height: 60px; border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255, 107, 0, 0.35), transparent 70%);
    filter: blur(6px);
  }

  /* landmark pose figure (design-system asset) as the camera subject */
  .figure {
    position: absolute; left: 50%; top: 305px; transform: translateX(-50%);
    height: 320px; opacity: 0.95;
  }

  /* status bar */
  .status { position: absolute; top: 14px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; font-size: 13px; font-weight: 700;
    color: rgba(255,255,255,.9); }

  /* top controls */
  .top { position: absolute; top: 44px; left: 16px; right: 16px;
    display: flex; align-items: center; justify-content: space-between; }
  .round { width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.12); display: flex; align-items: center;
    justify-content: center; font-size: 16px; font-weight: 700; }
  .tag { display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.12); border-radius: 999px;
    padding: 10px 16px; font-size: 13px; font-weight: 800; letter-spacing: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b00; }
  .dot.red { background: #ff4d4d; }

  .exlabel { position: absolute; top: 100px; left: 0; right: 0; text-align: center;
    font-size: 12px; font-weight: 800; letter-spacing: 3px; color: rgba(255,255,255,.85); }

  /* big rep counter */
  .rep { position: absolute; top: 128px; left: 0; right: 0; text-align: center;
    font-size: 128px; font-weight: 900; line-height: 1;
    text-shadow: 0 6px 40px rgba(0,0,0,.55); }
  .hint { position: absolute; top: 268px; left: 0; right: 0; text-align: center;
    font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.55); }

  /* viewfinder corner brackets */
  .corner { position: absolute; width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,.5); }
  .c1 { top: 96px;  left: 22px;  border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .c2 { top: 96px;  right: 22px; border-left: 0;  border-bottom: 0; border-radius: 0 8px 0 0; }
  .c3 { top: 596px; left: 22px;  border-right: 0; border-top: 0;    border-radius: 0 0 0 8px; }
  .c4 { top: 596px; right: 22px; border-left: 0;  border-top: 0;    border-radius: 0 0 8px 0; }

  /* pose skeleton (squat pose) */
  svg.pose { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); }

  /* bottom UI */
  .counting { position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%);
    background: rgba(20,16,12,.78); border-radius: 999px; padding: 12px 22px;
    font-size: 14px; font-weight: 700; }
  .actions { position: absolute; bottom: 56px; left: 24px; right: 24px;
    display: flex; gap: 14px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px; padding: 17px 0; font-size: 16px; font-weight: 800; }
  .pause { background: rgba(255,255,255,.14); color: #fff; flex: 0 0 128px; }
  .finish { background: #fff; color: #16130f; }
  .homebar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); }
</style>

<div class="status"><span>9:41</span><span>5G · 100%</span></div>

<div class="top">
  <div class="round">✕</div>
  <div class="tag"><span class="dot"></span>SQUATS</div>
  <div class="tag"><span class="dot red"></span>0:15</div>
</div>

<div class="exlabel">⚡ SQUATS</div>
<div class="rep">12</div>
<div class="hint">tap the number to fix a miss</div>

<div class="corner c1"></div><div class="corner c2"></div>
<div class="corner c3"></div><div class="corner c4"></div>

<div class="floor"></div>

<!-- landmark pose figure — same asset the app's workout flow uses -->
<img class="figure" src="landmark-squat.gif" alt="">

<div class="counting">Squats · counting</div>
<div class="actions">
  <div class="btn pause">◷ Pause</div>
  <div class="btn finish">✓ Finish</div>
</div>
<div class="homebar"></div>
