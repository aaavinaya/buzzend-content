<!--
  Buzzend · launch teaser — 1080×1920, 10s CSS animation.
  Recorded headlessly to video (see tools/record.mjs). Scene timeline:
    0.3s  logo pop + wordmark
    1.5s  headline "Fitness is better with friends."
    2.9s  phone slides up (home screen)
    4.7s  screen cycles: challenges → AI counter → streak (with captions)
    8.5s  CTA card
-->
<meta charset="utf-8">
<title>Buzzend teaser 10s</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../assets/fonts/Inter-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, sans-serif;
    background: linear-gradient(150deg, #ff6b00 0%, #ff9f43 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .g1 { width: 720px; height: 720px; right: -220px; top: -260px; background: rgba(255,255,255,.20); }
  .g2 { width: 640px; height: 640px; left: -240px; top: 900px; background: rgba(178,60,0,.45); }

  /* ── intro logo ── */
  .logo { position: absolute; top: 190px; left: 0; right: 0; text-align: center;
    opacity: 0; animation: pop .6s cubic-bezier(.2,1.4,.35,1) .3s forwards; }
  .logo img { width: 150px; height: 150px; border-radius: 24%;
    box-shadow: 0 18px 50px rgba(120,45,0,.45); }
  .logo .word { margin-top: 30px; font-size: 64px; font-weight: 900; letter-spacing: -1px; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }

  /* ── headline ── */
  .headline { position: absolute; top: 560px; left: 80px; right: 80px; text-align: center;
    font-size: 96px; font-weight: 900; line-height: 1.08; letter-spacing: -2.5px; }
  .headline span { display: block; opacity: 0; transform: translateY(60px);
    animation: rise .6s cubic-bezier(.2,1,.3,1) forwards; }
  .headline span:nth-child(1) { animation-delay: 1.5s; }
  .headline span:nth-child(2) { animation-delay: 1.7s; }
  .headline em { font-style: normal; color: #ffe3c9; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* ── phone ── */
  .phone { position: absolute; left: 50%; top: 1020px; width: 560px;
    background: #101415; border-radius: 62px; padding: 17px;
    box-shadow: 0 50px 110px rgba(0,0,0,.42);
    transform: translateX(-50%) translateY(1100px);
    animation: slideup .9s cubic-bezier(.2,1,.3,1) 2.9s forwards; }
  @keyframes slideup { to { transform: translateX(-50%) translateY(0); } }
  .phone::after { content: ""; position: absolute; top: 17px; left: 50%;
    transform: translateX(-50%); width: 150px; height: 36px; background: #101415;
    border-radius: 0 0 20px 20px; z-index: 3; }
  .screen { border-radius: 46px; overflow: hidden; background: #fff;
    height: 866px; position: relative; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: top; opacity: 0; }
  /* screen cycle: home 2.9–4.6, challenge 4.7–6.2, ai 6.2–7.7, streak 7.7–10 */
  .s-home      { animation: shot 1.7s linear 2.9s forwards; }
  .s-challenge { animation: shot 1.5s linear 4.7s forwards; }
  .s-ai        { animation: shot 1.5s linear 6.2s forwards; }
  .s-streak    { animation: shotHold 1.5s linear 7.7s forwards; }
  @keyframes shot     { 0% {opacity:0} 8% {opacity:1} 92% {opacity:1} 100% {opacity:0} }
  @keyframes shotHold { 0% {opacity:0} 8% {opacity:1} 100% {opacity:1} }

  /* ── feature captions (above phone) ── */
  .caps { position: absolute; top: 880px; left: 0; right: 0; text-align: center; }
  .cap { position: absolute; left: 0; right: 0; font-size: 44px; font-weight: 800;
    opacity: 0; transform: scale(.9); }
  .cap b { color: #ffe3c9; }
  .c1 { animation: cap 1.5s ease 4.7s forwards; }
  .c2 { animation: cap 1.5s ease 6.2s forwards; }
  .c3 { animation: cap 1.5s ease 7.7s forwards; }
  @keyframes cap { 0% {opacity:0; transform:scale(.9)} 12% {opacity:1; transform:scale(1)}
    88% {opacity:1} 100% {opacity:0} }

  /* ── CTA finale ── */
  .cta { position: absolute; top: 1500px; left: 50%;
    transform: translateX(-50%) scale(.6); opacity: 0;
    background: #fff; color: #ff6b00; border-radius: 999px;
    padding: 34px 64px; font-size: 40px; font-weight: 900;
    box-shadow: 0 20px 60px rgba(120,45,0,.4);
    animation: pop2 .5s cubic-bezier(.2,1.4,.35,1) 8.5s forwards; z-index: 6; }
  @keyframes pop2 { to { opacity: 1; transform: translateX(-50%) scale(1); } }
  .stores { position: absolute; top: 1640px; left: 0; right: 0; text-align: center;
    font-size: 28px; font-weight: 700; color: rgba(255,255,255,.92); opacity: 0;
    animation: rise .4s ease 8.8s forwards; z-index: 6; }
  /* dim the phone slightly under the CTA */
  .shade { position: absolute; inset: 0; background: rgba(60,20,0,.35); opacity: 0;
    animation: rise .5s ease 8.5s forwards; z-index: 4; pointer-events: none; }
</style>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="logo">
  <img src="../assets/app-icon.png" alt="">
  <div class="word">Buzzend</div>
</div>

<div class="headline">
  <span>Fitness is better</span>
  <span><em>with friends.</em></span>
</div>

<div class="caps">
  <div class="cap c1">🏆 Challenge your <b>crew</b></div>
  <div class="cap c2">⚡ AI counts your <b>reps</b></div>
  <div class="cap c3">🔥 Keep the <b>streak</b> alive</div>
</div>

<div class="phone">
  <div class="screen">
    <img class="s-home"      src="../assets/screens-clean/home.png" alt="">
    <img class="s-challenge" src="../assets/screens-clean/challenge.png" alt="">
    <img class="s-ai"        src="../assets/screens-clean/ai-counter.png" alt="">
    <img class="s-streak"    src="../assets/screens-clean/streak.png" alt="">
  </div>
</div>

<div class="shade"></div>
<span class="cta">Download free</span>
<div class="stores">App Store · Google Play</div>
