<!-- @dsCard group="Week 1 · Stories" -->
<!--
  DAY 3 · AI workouts — story/Reels/TikTok 1080×1920
  Reuse: swap .kicker / .headline / .sub / .cta text and the screenshot.
-->
<meta charset="utf-8">
<title>Day 3 — AI workouts (story 1080×1920)</title>
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .canvas {
    width: 1080px; height: 1920px;
    background: linear-gradient(170deg, #111111 0%, #1c0a00 55%, #2b1200 100%);
    color: var(--white);
    text-align: center;
  }
  .glow.g1 { width: 720px; height: 720px; right: -220px; top: -260px; background: rgba(255, 107, 0, 0.35); }
  .glow.g2 { width: 640px; height: 640px; left: -240px; top: 950px; background: rgba(226, 90, 0, 0.32); }

  .lockup { position: absolute; top: 110px; left: 0; right: 0; flex-direction: column; gap: 30px; }
  .lockup img { width: 128px; height: 128px; }
  .lockup .word { font-size: 56px; color: var(--white); }

  .kicker {
    position: absolute; top: 405px; left: 50%; transform: translateX(-50%);
    background: var(--primary);
    color: var(--white);
    padding: 18px 34px;
    font-size: 27px;
    letter-spacing: 4px;
    box-shadow: 0 12px 32px rgba(255, 107, 0, 0.35);
  }
  .headline {
    position: absolute; top: 505px; left: 80px; right: 80px;
    font-size: 100px;
    font-weight: 900;
    line-height: 1.06;
    letter-spacing: -2.5px;
  }
  .headline em { font-style: normal; color: var(--accent); }
  .sub {
    position: absolute; top: 820px; left: 130px; right: 130px;
    font-size: 33px;
    font-weight: 500;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.9);
  }
  .cta {
    position: absolute; top: 1030px; left: 50%; transform: translateX(-50%);
    background: var(--white); color: var(--primary);
    padding: 28px 52px; font-size: 31px;
    box-shadow: 0 16px 40px rgba(255, 107, 0, 0.30);
  }

  /* Phone bleeds off the bottom edge; the visible crop ends just below the
     pose skeleton's feet, hiding the Pause/Finish row at the bottom of the
     screenshot while keeping the pills, live counter and skeleton in frame. */
  .phone { position: absolute; left: 50%; top: 1150px; width: 500px; transform: translateX(-50%) rotate(-4deg); }
  .phone .screen { height: 780px; }
  .phone::after { width: 150px; height: 36px; }

  .chip { left: 615px; top: 1140px; padding: 22px 30px; font-size: 26px; transform: rotate(4deg); }
  .chip .em { font-size: 34px; }
</style>

<div class="canvas">
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="lockup">
    <img src="../../assets/app-icon.png" alt="">
    <div class="word">Buzzend</div>
  </div>

  <span class="pill kicker">DAY 3 · AI WORKOUTS</span>
  <div class="headline">It counts<br>your <em>reps.</em></div>
  <div class="sub">Point the camera at yourself and go. AI pose detection tracks every squat, push-up and jumping jack — hands-free.</div>
  <span class="pill cta">Try an AI workout</span>

  <div class="phone">
    <div class="screen"><img src="../../assets/screens-clean/ai-counter.png" alt="Buzzend AI rep counter screen"></div>
  </div>

  <div class="chip"><span class="em">⚡</span> 9 / 15 reps · counted live</div>
</div>
