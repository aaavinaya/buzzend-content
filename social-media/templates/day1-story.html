<!-- @dsCard group="Week 1 · Stories" -->
<!--
  DAY 1 · Launch announcement — story/Reels/TikTok 1080×1920
  Reuse: swap .kicker / .headline / .sub / .cta text and the screenshot.
-->
<meta charset="utf-8">
<title>Day 1 — Launch (story 1080×1920)</title>
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .canvas {
    width: 1080px; height: 1920px;
    background: var(--hero-grad);
    color: var(--white);
    text-align: center;
  }
  .glow.g1 { width: 720px; height: 720px; right: -220px; top: -260px; background: rgba(255, 255, 255, 0.20); }
  .glow.g2 { width: 640px; height: 640px; left: -240px; top: 900px; background: rgba(178, 60, 0, 0.45); }

  .lockup { position: absolute; top: 110px; left: 0; right: 0; flex-direction: column; gap: 30px; }
  .lockup img { width: 128px; height: 128px; }
  .lockup .word { font-size: 56px; color: var(--white); }

  .kicker {
    position: absolute; top: 425px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.4);
    padding: 18px 34px;
    font-size: 27px;
    letter-spacing: 4px;
  }
  .headline {
    position: absolute; top: 525px; left: 80px; right: 80px;
    font-size: 100px;
    font-weight: 900;
    line-height: 1.06;
    letter-spacing: -2.5px;
  }
  .headline em { font-style: normal; color: #ffe3c9; }
  .sub {
    position: absolute; top: 860px; left: 130px; right: 130px;
    font-size: 33px;
    font-weight: 500;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.92);
  }
  .cta {
    position: absolute; top: 1058px; left: 50%; transform: translateX(-50%);
    background: var(--white); color: var(--primary);
    padding: 28px 52px; font-size: 31px;
    box-shadow: 0 16px 40px rgba(120, 45, 0, 0.35);
  }

  .phone { position: absolute; left: 50%; transform: translateX(-50%); top: 1215px; width: 560px; }
  .phone .screen { height: 900px; }
  .phone::after { width: 150px; height: 36px; }
</style>

<div class="canvas">
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="lockup">
    <img src="../../assets/app-icon.png" alt="">
    <div class="word">Buzzend</div>
  </div>

  <span class="pill kicker">⚡ ALL NEW</span>
  <div class="headline">The new Buzzend <em>is here.</em></div>
  <div class="sub">Challenges with friends, daily streaks, live leaderboards — and AI that counts your reps.</div>
  <span class="pill cta">Get it free — link in bio ↗</span>

  <div class="phone">
    <div class="screen"><img src="../../assets/screens-clean/home.png" alt="Buzzend home screen"></div>
  </div>
</div>
