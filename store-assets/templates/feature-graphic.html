<!-- @dsCard group="Store · Google Play" -->
<!--
  Google Play feature graphic — 1024×500. Play crops edges on some surfaces:
  logo/tagline kept well inside the safe zone. No fine print by design.
-->
<meta charset="utf-8">
<title>Buzzend — Play feature graphic (1024×500)</title>
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  body { width: 1024px; height: 500px; overflow: hidden; }
  .canvas { width: 1024px; height: 500px; background: var(--hero-grad); color: var(--white); }
  .glow.g1 { width: 420px; height: 420px; right: -100px; top: -160px; background: rgba(255, 255, 255, 0.2); }
  .glow.g2 { width: 380px; height: 380px; left: -140px; bottom: -140px; background: rgba(178, 60, 0, 0.45); }

  .lockup { position: absolute; top: 96px; left: 84px; }
  .lockup img { width: 92px; height: 92px; }
  .lockup .word { font-size: 52px; color: var(--white); }

  .tag { position: absolute; left: 84px; top: 232px; width: 520px;
    font-size: 46px; font-weight: 900; line-height: 1.12; letter-spacing: -1px; }
  .tag em { font-style: normal; color: #ffe3c9; }
  .sub { position: absolute; left: 84px; top: 352px; font-size: 21px; font-weight: 700;
    color: rgba(255, 255, 255, 0.92); }

  .phone { position: absolute; right: 66px; top: 56px; width: 250px;
    border-radius: 40px; padding: 11px; }
  .phone::after { width: 76px; height: 20px; top: 11px; }
  .phone .screen { border-radius: 30px; height: 520px; }
</style>

<div class="canvas">
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="lockup">
    <img src="../../assets/app-icon.png" alt="">
    <div class="word">Buzzend</div>
  </div>

  <div class="tag">Fitness is better <em>with friends.</em></div>
  <div class="sub">Challenges · Streaks · Leaderboards · AI rep counting</div>

  <div class="phone">
    <div class="screen"><img src="../../assets/screens-clean/home.png" alt=""></div>
  </div>
</div>
